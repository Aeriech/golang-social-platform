version: '3.8'

services:
  db:
    container_name: postgres-db
    image: postgres:16.3
    environment:
      - POSTGRES_DB=social
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db-data: